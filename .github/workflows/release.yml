name: Windows Release

on:
  push:
    branches:
      - windows
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Build
        run: dotnet publish THN-Converter-Win.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows/win-x64/publish/*.exe
          tag_name: windows-${{ github.run_number }}
          name: Windows Release ${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}