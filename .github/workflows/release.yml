name: Release Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore THN-Converter-Win.csproj

      - name: Build
        run: dotnet build THN-Converter-Win.csproj -c Release --no-restore

      - name: Publish
        run: |
          dotnet publish THN-Converter-Win.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Package
        run: |
          Compress-Archive -Path bin/Release/net8.0-windows/win-x64/publish/THN-Converter-Win.exe -DestinationPath THN-Converter-Windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: THN-Converter-Windows.zip
          generate_release_notes: true
