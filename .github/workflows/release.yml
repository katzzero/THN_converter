name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build THN-Converter-Win.csproj -c Release

      - name: Publish
        run: dotnet publish THN-Converter-Win.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true --no-build

      - name: Package
        run: Compress-Archive -Force -Path bin/Release/net8.0-windows/win-x64/publish/THN-Converter-Win.exe -DestinationPath THN-Converter-Windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: THN-Converter-Windows.zip
          generate_release_notes: true
