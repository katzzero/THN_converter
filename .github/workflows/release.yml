name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish (single file)
        run: |
          dotnet publish THN-Converter-Win.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true

      - name: Package
        run: |
          Compress-Archive `
            -Path bin/Release/net8.0-windows/win-x64/publish/THN-Converter-Win.exe `
            -DestinationPath THN-Converter-Windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: THN-Converter-Windows.zip
          generate_release_notes: true
