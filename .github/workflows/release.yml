name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download FFmpeg
        run: |
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          rm -f ffmpeg.zip
          chmod +x ffmpeg

      - name: Build
        run: |
          xcodebuild -project THN-Converter.xcodeproj \
            -scheme THN-Converter \
            -configuration Release \
            -derivedDataPath build \
            clean build

      - name: Package
        run: |
          cd build/Build/Products/Release
          zip -r THN-Converter-macOS.zip THN-Converter.app

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/THN-Converter-macOS.zip
          generate_release_notes: true
